name: Validation Assistant Caisse
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt pytest
      - run: npm ci
      - run: python -m pytest tests -q
      - run: python scripts/test_ui.py
      - run: node tests/faults.cjs
      - run: node tests/admin-races.cjs
      - run: node tests/pwa.cjs
      - run: node tests/photo-trial.cjs
      - run: node tests/photo-recognition.cjs
      - run: python scripts/audit_search.py --output audit-results.json

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: caisse
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: caisse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caisse -d caisse_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://caisse:disposable-ci-password@localhost:5432/caisse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q
